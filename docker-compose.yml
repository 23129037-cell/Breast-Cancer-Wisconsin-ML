
services:
  api:
    build: .
    image: breast-cancer-ai
    container_name: breast-cancer-api
    command:
      - python
      - -m
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: .
    image: breast-cancer-ai
    container_name: breast-cancer-web
    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      PREDICTION_API_URL: http://api:8000/predict
    depends_on:
      - api
    restart: unless-stopped
